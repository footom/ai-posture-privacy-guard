[pytest]
# 讓tests/ 底下可以直接 `import tracker`、`import database`、`import models`
# (src/ 內部模組彼此是用相對於 src/ 的方式互相 import，例如 tracker.py 裡的 `import config as cfg`)
pythonpath = src

testpaths = tests

# 其中一個測試檔案import失敗時（例如mediapipe版本不對），
# 不要讓整個pytest執行中斷，其餘測試檔案仍照跑，方便定位問題範圍
addopts = --continue-on-collection-errors -v
